[project]
name = "duaxis-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
    "groq==1.7.0",
    "joblib==1.5.3",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
]

[tool.vercel]
entrypoint = "backend.app:app"

[tool.vercel.scripts]
build = "npm install && npx tailwindcss -i ./frontend/src/input.css -o ./frontend/dist/css/styles.css"

[tool.vercel.fastapi.static]
cdn = true
